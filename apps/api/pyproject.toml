[project]
name = "pcc-api"
version = "0.1.0"
description = "Personal Command Center API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "redis>=5,<7",
  "rq>=2,<3",
]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx2>=2", "ruff>=0.11,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/pcc"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100

[tool.uv]
default-groups = ["dev"]