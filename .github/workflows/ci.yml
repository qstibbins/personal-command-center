name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pcc
          POSTGRES_PASSWORD: pcc_ci_only
          POSTGRES_DB: pcc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pcc -d pcc_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://pcc:pcc_ci_only@localhost:5432/pcc_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --group dev
        working-directory: apps/api
      - run: uv run pytest
        working-directory: apps/api
      - run: uv run ruff check src tests
        working-directory: apps/api
  frontend:
    runs-on: ubuntu-latest
    env:
      # Placeholders so next build can compile Auth.js config without real secrets.
      AUTH_SECRET: ci-only-not-a-real-secret
      AUTH_GOOGLE_ID: ci-placeholder-client-id
      AUTH_GOOGLE_SECRET: ci-placeholder-client-secret
      PCC_ALLOWED_GOOGLE_EMAILS: ci@example.com
      PCC_SERVICE_CREDENTIAL: ci-only-service-credential
      DATABASE_URL: postgresql://pcc:pcc_ci_only@localhost:5432/pcc
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm lint:web
      - run: pnpm test:web
      - run: pnpm build:web
